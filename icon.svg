  <g mask="url(#faceCutouts)">
    <path fill="url(#body)" d="M56 424 91 369 159 289 263 348 309 307 365 271 358 149Q430 108 513 92L558 177 571 201Q627 195 683 201L742 92Q824 111 898 149L891 271Q947 304 992 348L1095 289Q1159 356 1198 424L1131 527V579H1025Q1005 579 1005 600V629Q1005 649 1025 649H1132V715H1025Q1005 715 1005 735V769Q1005 789 1025 789H1131V889Q1131 1020 1027 1088 912 1167 641 1167 368 1167 251 1088 124 1004 124 889V527Z"/>
    <path fill="url(#bodyGlow)" d="M56 424 91 369 159 289 263 348 309 307 365 271 358 149Q430 108 513 92L558 177 571 201Q627 195 683 201L742 92Q824 111 898 149L891 271Q947 304 992 348L1095 289Q1159 356 1198 424L1131 527V579H1025Q1005 579 1005 600V629Q1005 649 1025 649H1132V715H1025Q1005 715 1005 735V769Q1005 789 1025 789H1131V889Q1131 1020 1027 1088 912 1167 641 1167 368 1167 251 1088 124 1004 124 889V527Z"/>
