<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">AI gear logo</title>
  <desc id="desc">A blue gear-shaped robot badge with pixel-style AI lettering and transparent facial cutouts.</desc>
  <defs>
    <linearGradient id="body" x1="190" y1="150" x2="1030" y2="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3199df"/>
      <stop offset="0.48" stop-color="#55a5dc"/>
      <stop offset="1" stop-color="#2f8fd1"/>
    </linearGradient>
    <radialGradient id="bodyGlow" cx="0" cy="0" r="1" gradientTransform="translate(652 605) rotate(90) scale(572 596)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9bd4f3" stop-opacity=".3"/>
      <stop offset=".58" stop-color="#5bafe5" stop-opacity=".08"/>
      <stop offset="1" stop-color="#186eb2" stop-opacity=".18"/>
    </radialGradient>
    <linearGradient id="ink" x1="330" y1="410" x2="892" y2="790" gradientUnits="userSpaceOnUse">
