    <linearGradient id="whiteLine" x1="125" y1="823" x2="1131" y2="984" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".55" stop-color="#f7f7f7"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <filter id="soft" x="-12%" y="-12%" width="124%" height="124%">
